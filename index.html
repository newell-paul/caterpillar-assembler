<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caterpillar - BBC Micro (6502 assembly rewrite)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }   /* page never scrolls: keys reach the game, not the scrollbar */
    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      padding: 0.5rem;
    }
    h1 {
      font-size: 1.8rem;
      margin: 1rem 0 0.25rem;
      color: #fff;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 1rem;
    }
    .emulator-container {
      position: relative;
      /* Fill the height left over after the heading/instructions, keeping the
         921:733 aspect ratio. Capped at native size so it never upscales blurrily.
         Page stays within the viewport (body is overflow:hidden) so keys reach
         the game instead of scrolling the page. */
      flex: 1 1 auto;
      min-height: 0;
      aspect-ratio: 921 / 733;
      max-width: 921px;
      max-height: 733px;
      width: auto;
    }
    .emulator-container iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 4px;
    }
    .instructions {
      max-width: 600px;
      margin: 1rem 0;
      font-size: 0.9rem;
      line-height: 1.6;
      color: #aaa;
      text-align: center;
    }
    .instructions kbd {
      background: #333;
      border: 1px solid #555;
      border-radius: 3px;
      padding: 0.1em 0.4em;
      font-family: monospace;
      font-size: 0.85em;
      color: #fff;
    }
    .instructions p { margin: 0.5rem 0; }
    .footer {
      margin-top: auto;
      padding: 1rem;
      font-size: 0.75rem;
      color: #555;
    }
    .footer a { color: #777; }
  </style>
</head>
<body>
  <h1>Caterpillar</h1>
  <p class="subtitle">BBC Micro &middot; Paul Newell &middot; 1983, rewritten in 6502 assembly 2026</p>

  <div class="emulator-container">
    <iframe id="emulator" allow="autoplay" loading="eager"></iframe>
  </div>

  <div class="instructions">
    <p>Click the emulator to give it focus, then press any key to start.</p>
    <p>Use <kbd>Z</kbd> to move left and <kbd>M</kbd> to move right.</p>
    <p>Eat the seasonal fruit and acorns for points. Avoid the mushrooms!</p>
  </div>

  <div class="footer">
    <a href="https://github.com/mattgodbolt/jsbeeb">Powered by jsbeeb</a>
  </div>

  <script>
    const iframe = document.getElementById('emulator');
    const loc = window.location;
    const isLocal = loc.hostname === 'localhost' || loc.hostname === '127.0.0.1';

    // Stop game keys (arrows, space) from scrolling the page when focus has not
    // yet entered the cross-origin emulator iframe. Clicking the screen focuses it.
    const SCROLL_KEYS = new Set([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
                                 'PageUp', 'PageDown', 'Home', 'End']);
    window.addEventListener('keydown', (e) => {
      if (SCROLL_KEYS.has(e.key)) e.preventDefault();
    }, { passive: false });
    iframe.addEventListener('mouseenter', () => iframe.focus());

    const DISC = 'caterpillar.ssd';   // the 2026 assembly rewrite

    function bootDisc(discParam) {
      iframe.src = `https://bbc.xania.org/?disc=${discParam}&autoboot&embed`;
    }

    if (isLocal) {
      // HTTPS jsbeeb cannot fetch from HTTP localhost, so inline the disc as base64.
      fetch('/' + DISC)
        .then(r => r.arrayBuffer())
        .then(buf => {
          const bytes = new Uint8Array(buf);
          let binary = '';
          for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
          bootDisc('b64data:' + btoa(binary));
        });
    } else {
      // GitHub Pages (or any HTTPS host): the .ssd sits alongside this page.
      // jsbeeb wants the disc URL raw (unencoded), as in its own examples.
      bootDisc(new URL(DISC, loc.href).href);
    }
  </script>
</body>
</html>
