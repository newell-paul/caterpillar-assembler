<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caterpillar - BBC Micro (1983)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }
    h1 {
      font-size: 1.8rem;
      margin: 1rem 0 0.25rem;
      color: #fff;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 1rem;
    }
    .emulator-container {
      position: relative;
      width: 921px;
      max-width: 100%;
      aspect-ratio: 921 / 733;
    }
    .emulator-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 4px;
    }
    .instructions {
      max-width: 600px;
      margin: 1rem 0;
      font-size: 0.9rem;
      line-height: 1.6;
      color: #aaa;
      text-align: center;
    }
    .instructions kbd {
      background: #333;
      border: 1px solid #555;
      border-radius: 3px;
      padding: 0.1em 0.4em;
      font-family: monospace;
      font-size: 0.85em;
      color: #fff;
    }
    .instructions p { margin: 0.5rem 0; }
    .version-toggle {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .version-toggle button {
      background: #2a2a44;
      color: #ccc;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 0.4rem 0.9rem;
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .version-toggle button:hover { background: #353560; }
    .version-toggle button.active {
      background: #4a4a8a;
      color: #fff;
      border-color: #6a6ab0;
    }
    .footer {
      margin-top: auto;
      padding: 1rem;
      font-size: 0.75rem;
      color: #555;
    }
    .footer a { color: #777; }
  </style>
</head>
<body>
  <h1>Caterpillar</h1>
  <p class="subtitle">BBC Micro &middot; Paul Newell &middot; 1983</p>

  <div class="version-toggle">
    <button id="btn-2026" class="active">2026 — Assembly rewrite</button>
    <button id="btn-1983">1983 — Original BASIC</button>
  </div>

  <div class="emulator-container">
    <iframe id="emulator" allow="autoplay" loading="eager"></iframe>
  </div>

  <div class="instructions">
    <p>Click the emulator to give it focus, then press any key to start.</p>
    <p>Use <kbd>Z</kbd> to move left and <kbd>M</kbd> to move right.</p>
    <p>Eat leaves, twigs, flowers, apples and acorns for points. Avoid the mushrooms!</p>
  </div>

  <div class="footer">
    <a href="https://github.com/mattgodbolt/jsbeeb">Powered by jsbeeb</a>
  </div>

  <script>
    const iframe = document.getElementById('emulator');
    const loc = window.location;
    const isLocal = loc.hostname === 'localhost' || loc.hostname === '127.0.0.1';

    const DISCS = {
      '2026': 'caterpillar.ssd',           // the assembly rewrite
      '1983': 'caterpillar-original.ssd',  // the original BASIC listing
    };

    function bootDisc(discParam) {
      iframe.src = `https://bbc.xania.org/?disc=${discParam}&autoboot&embed`;
    }

    function loadVersion(version) {
      const file = DISCS[version];
      if (isLocal) {
        // HTTPS jsbeeb cannot fetch from HTTP localhost, so inline the disc as base64.
        fetch('/' + file)
          .then(r => r.arrayBuffer())
          .then(buf => {
            const bytes = new Uint8Array(buf);
            let binary = '';
            for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
            bootDisc('b64data:' + btoa(binary));
          });
      } else {
        // GitHub Pages (or any HTTPS host): the .ssd sits alongside this page.
        bootDisc(encodeURIComponent(new URL(file, loc.href).href));
      }
    }

    const btn2026 = document.getElementById('btn-2026');
    const btn1983 = document.getElementById('btn-1983');
    function select(version, activeBtn, otherBtn) {
      activeBtn.classList.add('active');
      otherBtn.classList.remove('active');
      loadVersion(version);
    }
    btn2026.addEventListener('click', () => select('2026', btn2026, btn1983));
    btn1983.addEventListener('click', () => select('1983', btn1983, btn2026));

    // Default to the 2026 rewrite.
    loadVersion('2026');
  </script>
</body>
</html>
